<!-- TABLEAU COMPARATIF (Pépouze) — chez eux ce n'est pas un tableau HTML mais
       une illustration vectorielle, d'où sa tenue. Reprise telle quelle, avec
       le <style> interne du SVG recoloré dans la palette ToonJaune. -->
  <section class="section" style="background: var(--cendre);">
    <div class="enveloppe">
      <div class="chapeau">
        <h2>Quand l'art rencontre <span class="accent">tes personnages préférés</span></h2>
      </div>
      <picture class="compare-illu">
        <source media="(max-width: 700px)" srcset="assets/produit/compare-mobile.svg">
        <img src="../substituts/paysage.svg"
             alt="Tableau comparatif : ToonJaune face aux autres services de portrait personnalisé"
             width="696" height="320" loading="lazy">
      </picture>
    </div>
  </section>
