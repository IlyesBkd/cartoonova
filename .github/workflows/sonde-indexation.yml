name: Sondes d'indexation et de diffusion

# Releve chaque nuit combien de pages sont reellement dans l'index de Google,
# lesquelles n'y sont pas, et pourquoi.
# Voir `scripts/sonde-indexation.mts` pour le raisonnement.
#
# ── Pourquoi cette sonde plutot qu'une console de webmaster ──────────────
#
# La question — « combien de pages sont indexees, et qu'est-ce qui bloque les
# autres ? » — est celle qu'on serait alle poser a la main dans une interface.
# L'API d'inspection d'URL y repond sans que personne ouvre quoi que ce soit,
# avec le compte de service qui resoumet deja le plan du site.
#
# Le quota autorise 2 000 inspections par jour. On en fait soixante, toujours
# les adresses vues il y a le plus longtemps : la serie historique se construit
# sans a-coups, et une panne d'un jour ne laisse pas de trou.
#
# Secrets a definir dans Settings > Secrets and variables > Actions :
#   DATABASE_URL          la meme chaine Neon que Vercel
#   GSC_SITE_URL          la propriete Search Console (ex. sc-domain:exemple.com)
#   GSC_CLIENT_EMAIL      compte de service, deja utilise par le cron SEO
#   GSC_PRIVATE_KEY_B64   sa cle privee, encodee en base64
#   MERCHANT_ACCOUNT_ID   compte Google Merchant, pour la seconde sonde
#   DISCORD_WEBHOOK_URL   point quand le total bouge, alerte si une page sort
#
# Variables (Settings > Variables), facultatives :
#   INDEX_PAR_PASSAGE     adresses inspectees par nuit  (defaut 60)
#
# Les deux sondes partagent un travail : elles interrogent le meme compte de
# service, tournent a la meme heure, et n'ont aucune raison d'occuper deux
# machines. La seconde ne doit pas faire echouer la premiere — voir son etape.

# ── Pourquoi un enchainement et non un horaire ───────────────────────────
#
# Ce travail etait planifie a 03h20, apres la redaction de 02h10. Sur le
# papier. En pratique GitHub deprogramme les taches planifiees de plusieurs
# heures : la redaction est partie a 14h17 et la sonde de citation a 16h32 pour
# des horaires annonces a 02h10 et 04h05. L'ordre n'existait que dans les
# commentaires.
#
# `workflow_run` le rend reel : la sonde part quand la redaction a fini, quoi
# qu'il arrive a l'horloge. Les pages ecrites cette nuit sont donc relevees
# avec leur nouveau contenu, et non avec celui de la veille.

on:
  workflow_run:
    workflows: ["Contenu des fiches produit"]
    types: [completed]
  workflow_dispatch:

# Deux passages simultanes se disputeraient la meme ligne du jour.
concurrency:
  group: sonde-indexation
  cancel-in-progress: false

jobs:
  relever:
    # Une redaction en echec n'empeche pas de mesurer — les pages d'hier sont
    # toujours la. Une execution annulee, elle, ne doit rien entrainer.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    # Soixante inspections espacees de 150 ms, plus l'installation. Large.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Le script importe `lib/catalogue.ts` et `lib/googleAuth.ts` : il lui
      # faut les dependances du projet. `npm install` et non `npm ci` — le
      # verrou n'est pas parfaitement synchronise, voir contenu-fiches.yml.
      - name: Installer les dependances
        run: npm install --no-audit --no-fund

      - name: Relever l'indexation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY_B64: ${{ secrets.GSC_PRIVATE_KEY_B64 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INDEX_PAR_PASSAGE: ${{ vars.INDEX_PAR_PASSAGE }}
        run: npx tsx scripts/sonde-indexation.mts

      # `continue-on-error` : un incident cote Merchant ne doit pas faire passer
      # tout le travail en echec alors que le releve d'indexation, lui, a
      # reussi. Les deux mesures sont independantes.
      - name: Relever la diffusion Shopping
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY_B64: ${{ secrets.GSC_PRIVATE_KEY_B64 }}
          MERCHANT_ACCOUNT_ID: ${{ secrets.MERCHANT_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/sonde-marchand.mts

      # Playwright a besoin de son navigateur, et de lui seul : `--with-deps`
      # installerait des paquets systeme dont un runner Ubuntu dispose deja.
      - name: Installer le navigateur
        continue-on-error: true
        run: npx playwright install chromium

      # Meme raison que pour Merchant : une mesure de vitesse ratee ne doit pas
      # faire passer en echec un releve d'indexation reussi.
      - name: Mesurer la vitesse
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: https://www.cartoonova.com
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VITESSE_PASSAGES: ${{ vars.VITESSE_PASSAGES }}
        run: npx tsx scripts/sonde-vitesse.mts
