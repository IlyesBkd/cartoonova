name: Contenu des fiches produit

# Redige le texte propre a chaque fiche produit, par petits lots.
# Voir `scripts/genere-contenu-fiches.mts` pour le raisonnement.
#
# ── Pourquoi en cron, et ce qui tient lieu de relecture ──────────────────
#
# Personne ne relit les lots. Le travail ecrit donc seul, langue par langue :
# le script epuise le francais avant de passer a l'anglais, puis aux huit
# autres. La progression par vagues se fait d'elle-meme.
#
# Ce qui remplace un lecteur humain, ce sont les trois gardes du script — un
# texte trop court, un texte qui ne nomme jamais son univers, ou un texte trop
# proche d'une fiche deja ecrite n'est pas publie — et le compte rendu Discord
# de fin de passage. Une panne d'API ou un gabarit qui se mettrait a produire
# la meme chose partout se voit le lendemain matin, sans avoir rien a ouvrir.
#
# Le juge final reste la sonde de citation : si la part de requetes citees ne
# monte pas quelques semaines apres un lot, c'est le gabarit qu'il faut revoir,
# pas le volume.
#
# ── Pourquoi ici plutot que sur Vercel ───────────────────────────────────
#
# Six redactions longues en serie depassent le budget d'une fonction Vercel.
# Actions n'a pas cette contrainte, ecrit dans la meme base Neon, et le moteur
# de contenu y tourne deja.
#
# Secrets (Settings > Secrets and variables > Actions) :
#   DATABASE_URL   la meme chaine Neon que Vercel
#   AI_API_KEY     deja presente pour le moteur de contenu
#
# Variables facultatives (Settings > Variables) :
#   AI_ENDPOINT    point compatible OpenAI  (defaut api.openai.com)
#   AI_MODEL       modele redacteur         (defaut gpt-4o)

# Tete de chaine. En finissant, ce travail declenche les sondes d'indexation
# et de diffusion, qui declenchent a leur tour la sonde de citation. C'est le
# seul horaire de la chaine, et le seul qui n'ait pas besoin d'etre precis :
# GitHub le retardera de quelques heures, les trois etapes resteront dans
# l'ordre.

on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:
    inputs:
      langues:
        description: "Langues a traiter, separees par une virgule (vide = les dix)"
        required: false
        default: ""
      nombre:
        description: "Fiches redigees au maximum pendant ce passage"
        required: false
        default: "12"

# Deux passages simultanes reliraient la meme table avant de s'ecrire dessus,
# et la garde anti-doublon ne verrait pas ce que l'autre vient d'ecrire.
concurrency:
  group: contenu-fiches
  cancel-in-progress: false

jobs:
  rediger:
    runs-on: ubuntu-latest
    # Une redaction longue prend une a deux minutes ; large, mais borne.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Le script importe `lib/catalogue.ts` et `lib/contenuFiche.ts` : il lui
      # faut les dependances du projet, pas seulement le pilote Neon.
      #
      # `npm install` et non `npm ci` : le verrou n'est pas parfaitement
      # synchronise — `next-intl` embarque un `@swc/core` qui reclame
      # `@swc/helpers >=0.5.17` alors que la racine est en 0.5.15, et aucune
      # entree ne satisfait cette contrainte. `npm install` la resout, `npm ci`
      # refuse de deviner et s'arrete. C'est sans consequence ici : ce travail
      # redige du texte, il ne construit pas le site, et il n'a pas besoin d'un
      # arbre reproductible au paquet pres. Vercel installe de la meme facon et
      # deploie sans probleme.
      - name: Installer les dependances
        run: npm install --no-audit --no-fund

      - name: Rediger le lot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          # Vides lors d'un declenchement planifie : le script retombe alors
          # sur ses propres valeurs — les dix langues dans l'ordre des vagues.
          CONTENU_LANGUES: ${{ inputs.langues }}
          CONTENU_PAR_PASSAGE: ${{ inputs.nombre || vars.CONTENU_PAR_PASSAGE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/genere-contenu-fiches.mts
