server {
    listen 80;
    listen [::]:80;
    server_name files.cartoonova.com;
    server_tokens off;
    access_log off;
    error_log /dev/null emerg;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cartoonova-acme;
        try_files $uri =404;
    }
    location / { return 404; }
}
