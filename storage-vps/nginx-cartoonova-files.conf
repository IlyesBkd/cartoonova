# Cartoonova only. Install after explicit approval; no wildcard/default server.
server {
    listen 80;
    listen [::]:80;
    server_name files.cartoonova.com;
    access_log off;
    error_log /dev/null emerg;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cartoonova-acme;
        try_files $uri =404;
    }
    location / { return 308 https://files.cartoonova.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name files.cartoonova.com;
    ssl_certificate /etc/letsencrypt/live/files.cartoonova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.cartoonova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /dev/null emerg;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;
    client_max_body_size 10m;
    location ^~ /v1/files/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host private-storage;
        proxy_set_header Connection close;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_max_temp_file_size 0;
    }
    location / { return 404; }
}
